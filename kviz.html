<style>
.quiz-box {
    max-width: 900px;
    margin: 40px auto;
}

.difficulties {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin: 25px 0;
}

.difficulty {
    padding: 25px;
    border: 2px solid #8b633c;
    border-radius: 15px;
    background: #fff8e9;
    cursor: pointer;
    text-align: center;
    font-size: 18px;
}

.difficulty.active {
    background: #76502e;
    color: white;
}

#startQuiz {
    display: block;
    margin: 20px auto;
    padding: 15px 35px;
    border: 0;
    border-radius: 10px;
    background: #76502e;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

#startQuiz:hover {
    background: #56391f;
}

.question {
    font-size: 25px;
    margin: 30px 0;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.answer {
    padding: 20px;
    border: 2px solid #c9ad88;
    border-radius: 12px;
    background: #fffaf0;
    cursor: pointer;
    text-align: left;
    font-size: 17px;
}

.answer:hover {
    background: #f2e3c8;
}

.answer.correct {
    background: #b9d9ad;
}

.answer.wrong {
    background: #e5aaa0;
}

.score {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    font-weight: bold;
}

.result {
    text-align: center;
    padding: 40px;
}

.restart {
    padding: 15px 30px;
    border: 0;
    border-radius: 10px;
    background: #76502e;
    color: white;
    cursor: pointer;
}

@media(max-width:700px) {
    .difficulties,
    .answers {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

/* =========================
   PROMÍCHÁNÍ
========================= */

function shuffle(array) {

    const arr = [...array];

    for (let i = arr.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] = [arr[j], arr[i]];
    }

    return arr;
}


/* =========================
   HRA
========================= */

let selectedLevel = "easy";

let quiz = [];

let currentQuestion = 0;

let score = 0;


/* =========================
   OBTÍŽNOST
========================= */

document.querySelectorAll(".difficulty").forEach(button => {

    button.addEventListener("click", () => {

        document.querySelectorAll(".difficulty")
            .forEach(b => b.classList.remove("active"));

        button.classList.add("active");

        selectedLevel = button.dataset.level;

    });

});


/* =========================
   START
========================= */

document.getElementById("startQuiz").addEventListener("click", () => {

    quiz = shuffle(questions[selectedLevel])
        .slice(0, 15);

    currentQuestion = 0;

    score = 0;

    document.getElementById("menu").style.display = "none";

    document.getElementById("game").style.display = "block";

    showQuestion();

});


/* =========================
   OTÁZKA
========================= */

function showQuestion() {

    const q = quiz[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "Otázka " + (currentQuestion + 1) + " / 15";

    document.getElementById("score").textContent =
        "Skóre: " + score;


    document.getElementById("question").textContent =
        q.q;


    const answers = q.a.map((text, index) => ({
        text: text,
        correct: index === q.c
    }));


    /* TADY SE OPRAVDU MÍCHAJÍ ODPOVĚDI */

    const shuffledAnswers = shuffle(answers);


    const container =
        document.getElementById("answers");


    container.innerHTML = "";


    shuffledAnswers.forEach((answer, index) => {

        const button =
            document.createElement("button");

        button.className = "answer";

        button.textContent =
            String.fromCharCode(65 + index) +
            ". " +
            answer.text;


        button.addEventListener("click", () => {

            answerQuestion(button, answer.correct);

        });


        container.appendChild(button);

    });

}


/* =========================
   ODPOVĚĎ
========================= */

function answerQuestion(button, correct) {

    document
        .querySelectorAll(".answer")
        .forEach(b => b.disabled = true);


    if (correct) {

        button.classList.add("correct");

        score++;

    } else {

        button.classList.add("wrong");

        document
            .querySelectorAll(".answer")
            .forEach(b => {

                if (b.dataset.correct === "true") {

                    b.classList.add("correct");

                }

            });

    }


    setTimeout(() => {

        currentQuestion++;


        if (currentQuestion < 15) {

            showQuestion();

        } else {

            showResult();

        }

    }, 700);

}


/* =========================
   VÝSLEDEK
========================= */

function showResult() {

    document.getElementById("game").style.display = "none";

    const result =
        document.getElementById("result");


    let text;


    if (score === 15) {

        text = "🏆 Dokonalý výsledek!";

    } else if (score >= 12) {

        text = "⭐ Výborně!";

    } else if (score >= 9) {

        text = "👏 Velmi dobrá znalost seriálu!";

    } else if (score >= 6) {

        text = "👍 Slušný výsledek!";

    } else {

        text = "📺 Dej si ještě jedno kolo!";

    }


    result.innerHTML = `

        <div class="result">

            <h2>${text}</h2>

            <h3>${score} / 15 správně</h3>

            <button class="restart" onclick="location.reload()">
                HRÁT ZNOVU
            </button>

        </div>

    `;


    result.style.display = "block";

}
